services:
  postgres:
    image: postgres:16-alpine
    container_name: hashwatch-postgres
    environment:
      POSTGRES_DB: hashwatch_db
      POSTGRES_USER: hashwatch
      POSTGRES_PASSWORD: hashwatch_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hashwatch -d hashwatch_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
