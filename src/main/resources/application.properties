# ==============================================================================
# HashWatch - Core Application Configuration (Sprint 1: S1-T1)
# ==============================================================================
spring.application.name=HashWatch
server.port=8080

# ------------------------------------------------------------------------------
# Active Profile
# Defaults to 'h2' for zero-setup out-of-the-box local development.
# Switch to 'postgres' for Docker/PostgreSQL production testing:
#   .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=postgres
# ------------------------------------------------------------------------------
spring.profiles.active=h2

# ------------------------------------------------------------------------------
# Common JPA & Hibernate Settings
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------------------
# HikariCP Connection Pool Configuration (S1-T1)
# ------------------------------------------------------------------------------
spring.datasource.hikari.pool-name=HashWatchHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ------------------------------------------------------------------------------
# Quartz Scheduler Configuration
# ------------------------------------------------------------------------------
spring.quartz.job-store-type=memory
spring.quartz.properties.org.quartz.threadPool.threadCount=5

# ------------------------------------------------------------------------------
# HashWatch Core Engine Properties
# ------------------------------------------------------------------------------
hashwatch.crypto.key-directory=keys/
hashwatch.crypto.algorithm=Ed25519
hashwatch.crypto.digest-algorithm=SHA-256
hashwatch.monitor.scan-interval-seconds=30
hashwatch.monitor.scan-enabled=true
hashwatch.monitor.watch-directories=./watched_files

# ------------------------------------------------------------------------------
# Thymeleaf & UI Configuration
# ------------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
