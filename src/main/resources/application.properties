# ==============================================================================
# HashWatch - Core Application Configuration
# ==============================================================================
spring.application.name=HashWatch
server.port=8080

# ------------------------------------------------------------------------------
# Active Profile (defaults to 'h2' for easy out-of-the-box local development;
# switch to 'postgres' for production or docker testing)
# ------------------------------------------------------------------------------
spring.profiles.active=postgres

# ------------------------------------------------------------------------------
# PostgreSQL Configuration (Active when spring.profiles.active=postgres)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/hashwatch_db
spring.datasource.username=hashwatch
spring.datasource.password=hashwatch_secret
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------------------
# Quartz Scheduler Configuration
# ------------------------------------------------------------------------------
spring.quartz.job-store-type=memory
spring.quartz.properties.org.quartz.threadPool.threadCount=5

# ------------------------------------------------------------------------------
# HashWatch Core Engine Properties
# ------------------------------------------------------------------------------
hashwatch.crypto.key-directory=keys/
hashwatch.crypto.algorithm=Ed25519
hashwatch.crypto.digest-algorithm=SHA-256
hashwatch.monitor.scan-interval-seconds=30
hashwatch.monitor.scan-enabled=true
hashwatch.monitor.watch-directories=./watched_files

# ------------------------------------------------------------------------------
# Thymeleaf & UI Configuration
# ------------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
