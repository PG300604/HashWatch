# ==============================================================================
# HashWatch - PostgreSQL 16 Profile (Sprint 1: S1-T1)
# Activate via: .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=postgres
# ==============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/hashwatch_db
spring.datasource.username=hashwatch
spring.datasource.password=hashwatch_secret
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
